version: "1.0"
policy_id: "tn_kmut_baseline"
policy_name: "Kalaignar Magalir Urimai Thogai (KMUT) - Strict Baseline"
description: "Experiment A: Strict official eligibility rule baseline without outcome tuning."

target_unit: "household"
benefit_calculation:
  type: "flat"
  monthly_amount: 1000.0
  annual_amount: 12000.0

eligibility_rules:
  - rule_id: "gender_rule"
    variable: "gender"
    operator: "=="
    value: "Female"
  - rule_id: "age_rule"
    variable: "age"
    operator: ">="
    value: 21
  - rule_id: "relationship_rule"
    variable: "relationship_to_head"
    operator: "in"
    value: ["Head", "Spouse"]
  - rule_id: "income_proxy_rule"
    variable: "consumption_expenditure"
    operator: "<="
    value: 250000.0

implementation_parameters:
  takeup_rate: 1.0                       # Strict baseline assumes 100% take-up of eligible population
  approval_probability: 1.0              # Strict baseline assumes 100% administrative approval
  documentation_pass_rate: 1.0
